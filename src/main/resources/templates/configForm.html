<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>新增数据库配置</title>
	<link href="/webdb/layui/css/layui.css" rel="stylesheet">
</head>

<body>
	<form class="layui-form" action="" method="post">
		<input id="id" type="hidden" name="id" value="${info.id!}" />
		<br/>
		<div class="layui-form-item">
			<div class="layui-inline ">
				<label class="layui-form-label">会话名称</label>
				<div class="layui-input-inline">
					<input id="title" type="text" name="title" value="${info.title!}" lay-verify="required"
						class="layui-input">
				</div>
			</div>
		</div>
		<div class="layui-form-item">
					<div class="layui-inline ">
						<label class="layui-form-label">数据库类型</label>
						<div class="layui-input-inline">
							<select id="dbtype" name="dbtype" lay-filter="dbType">
								<option value="mysql">MySQL</option>
								<option value="oracle">Oracle</option>
								<option value="dm">达梦</option>
								<option value="pg">PostgreSQL</option>
							</select>
						</div>
					</div>
				</div>
		<div class="layui-form-item">
			<label class="layui-form-label">连接信息</label>
			<div lass="layui-inline ">
							<div class="layui-input-inline" style="width:100px">
								<input id="host" type="text" name="host" value="${info.host!}" lay-verify="required"
									placeholder="主机名/IP" class="layui-input">
							</div>
						</div>
			<div lass="layui-inline " >
							<div class="layui-input-inline" style="width:100px">
								<input id="port" type="text" name="port" value="${info.port?string("0")}" lay-verify="required"
									placeholder="端口" class="layui-input">
							</div>
						</div>
						<div class="layui-inline ">
										<div class="layui-input-inline" style="width:100px">
											<input id="dbname" type="text" name="dbname" value="${info.dbname!}" lay-verify="required"
												placeholder="数据库名" class="layui-input">
										</div>
									</div>
		</div>
		<div class="layui-form-item">
			<div class="layui-inline " >
				<label class="layui-form-label">账号信息</label>
				<div class="layui-input-inline" style="width:130px">
					<input id="uname" type="text" name="uname" value="${info.uname!}" lay-verify="required"
						placeholder="账号" class="layui-input">
				</div>
			</div>
			<div class="layui-inline " >
				<div class="layui-input-inline" style="width:130px">
					<input id="upass" type="password" name="upass" value="${info.upass!}" lay-verify="required"
						placeholder="密码" class="layui-input">
				</div>
			</div>
		</div>
		<div class="layui-form-item">	
			<div class="layui-inline ">
				<label class="layui-form-label">备注</label>
				<div class="layui-input-inline" style="width:380px;height: 50px;">
					<textarea id="opt" placeholder="请输入内容" class="layui-textarea" rows="2" cols="90">${info.opt!}</textarea>
				</div>
			</div>
		</div>
		</div>
	</form>

</body>
<script src="/webdb/layui/layui.js"></script>
<script type="text/javascript" src="/webdb/jquery-3.7.1.min.js"></script>
<script>
	var form = layui.form;
	var dbtype="${info.dbtype!'mysql'}";
	form.on('select(dbType)', function(data){
	    var elem = data.elem; // 获得 select 原始 DOM 对象
	    var value = data.value; // 获得被选中的值
	    var othis = data.othis; // 获得 select 元素被替换后的 jQuery 对象
		dbtype=value;
		setupDefaultPort(value);
	});
	
	function setupDefaultPort(value){
		switch(value){
					case 'mysql':{
						$('#port').val(3306);
					};break;
					case "oracle":{
						$('#port').val(1521);
					};break;
					case "pg":{
						$('#port').val(5432);
					};break;
					case "dm":{
						$('#port').val(5236);
					};break;
				}
	}
	  
	  window.onload=function(){
		if(!$('#id').val()||$('#id').val()<=0){
							setupDefaultPort(dbtype);
						}
		// 设置 dbtype 下拉框选中值
		$('#dbtype').val(dbtype);
		form.render('select');
	  }
	
	
	var originalTitle = "${info.title!}";
	
	parent.saveForm = function () {
		var formOK = form.validate('#title') && form.validate('#host') && form.validate('#port') && form.validate('#uname') && form.validate('#upass');

		if (!formOK) {
			return Promise.resolve({
				code: 1,
				msg: "表单验证失败"
			});
		}

		var cfg = {
			id: parseInt($('#id').val()) || Date.now(),
			title: $.trim($('#title').val()),
			host: $.trim($('#host').val()),
			uname: $.trim($('#uname').val()),
			upass: $.trim($('#upass').val()),
			port: parseInt($.trim($('#port').val())) || 3306,
			dbname: $.trim($('#dbname').val()),
			dbtype: dbtype,
			opt: $.trim($('#opt').val())
		};

		// 存到 localStorage
		var configs = parent.WebdbCrypto ? parent.WebdbCrypto.loadConfigs() : JSON.parse(localStorage.getItem('webdb_configs') || '[]');
		var existIdx = -1;
		// 用原始 title 查找，支持修改会话名称
		var matchTitle = originalTitle || cfg.title;
		configs.forEach(function(c, i) { if (c.title === matchTitle) existIdx = i; });
		if (existIdx >= 0) {
			// 如果改了 title，先删除后端旧的
			if (originalTitle && originalTitle !== cfg.title) {
				$.ajax({ url: '/webdb/config/del', type: 'POST', contentType: 'application/json', data: JSON.stringify({ title: originalTitle }), async: false });
			}
			configs[existIdx] = cfg;
		} else {
			configs.push(cfg);
		}
		if (parent.WebdbCrypto) {
			parent.WebdbCrypto.saveConfigs(configs);
		} else {
			localStorage.setItem('webdb_configs', JSON.stringify(configs));
		}

		// 同步到后端
		return new Promise(function (resolve) {
			$.ajax({
				url: '/webdb/config/save',
				type: 'POST',
				contentType: 'application/json',
				data: JSON.stringify(cfg),
				success: function(r) { resolve({ code: 0, msg: 'success' }); },
				error: function() { resolve({ code: 0, msg: 'success' }); }
			});
		});
	};

</script>

</html>
