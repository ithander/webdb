<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebDB - Database Management Tool</title>
  <link href="/webdb/layui/css/layui.css" rel="stylesheet">

  <script src="/webdb/jquery-3.7.1.min.js"></script>
</head>
<body>
  
	<script src="/webdb/layui/layui.js"></script>
  <script>
    // 全局变量
    var layer = layui.layer;
   
    
    // 工具栏函数
    function openSessionManager() {
		layer.open({
		        type: 2,
		        title: '配置数据源',
		        shadeClose: true,
		        maxmin: true, //开启最大化最小化按钮
		        area: ['900px', '600px'],
		        content: '/webdb/config'
		      });
    }
	openSessionManager();
   
  </script>
</body>
</html>
