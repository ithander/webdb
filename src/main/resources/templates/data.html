<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebDB - Database Management Tool</title>
  <link href="/webdb/layui/css/layui.css" rel="stylesheet">
</head>

<body>
	<tabl>
		<thead>
			<tr>
				<th>
					<div class="layui-form">
					<textarea class="sql-editor" id="sqlEditor" placeholder="输入 SQL 查询语句..." class="layui-textarea">SELECT * FROM </textarea>
					</div>
				</th>
			</tr>
			<tr>
				<th>
					<div style="margin-top: 10px;">
						            <button class="toolbar-btn primary" onclick="executeQuery()">
						              <i class="layui-icon layui-icon-triangle-r"></i>
						              执行 (F9)
						            </button>
						            <button class="toolbar-btn" onclick="clearEditor()">
						              <i class="layui-icon layui-icon-delete"></i>
						              清空
						            </button>
						          </div>
				</th>
			</tr>
		</thead>
		<tbody>
			<tr>
				<td>
					
				</td>
			</tr>
		</tbody>
	</tabl>
	
	          
	
</body>
</html>
