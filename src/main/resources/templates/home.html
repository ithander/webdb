<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebDB - Database Management Tool</title>
  <link href="/webdb/layui/css/layui.css" rel="stylesheet">
  <link rel="stylesheet" href="/webdb/zTree/css/metroStyle/metroStyle.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body, html {
      height: 100%;
      overflow: hidden;
      font-family: "Microsoft YaHei", Arial, sans-serif;
    }
    
    /* 顶部工具栏 */
    .toolbar {
      height: 80px;
      background: linear-gradient(to bottom, #f8f9fa 0%, #e9ecef 100%);
      border-bottom: 1px solid #dee2e6;
      padding: 5px 10px;
      display: flex;
      flex-direction: column;
    }
    
    .toolbar-menu {
      display: flex;
      gap: 15px;
      padding: 5px 0;
      border-bottom: 1px solid #dee2e6;
      margin-bottom: 5px;
    }
    
    .toolbar-menu a {
      color: #495057;
      text-decoration: none;
      padding: 2px 8px;
      font-size: 13px;
      cursor: pointer;
    }
    
    .toolbar-menu a:hover {
      background-color: #e9ecef;
      border-radius: 3px;
    }
    
    .toolbar-buttons {
      display: flex;
      gap: 5px;
      align-items: center;
    }
    
    .toolbar-btn {
      padding: 4px 10px;
      border: 1px solid #ced4da;
      background: white;
      border-radius: 3px;
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s;
    }
    
    .toolbar-btn:hover {
      background: #f8f9fa;
      border-color: #adb5bd;
    }
    
    .toolbar-btn.primary {
      background: #28a745;
      color: white;
      border-color: #28a745;
    }
    
    .toolbar-btn.primary:hover {
      background: #218838;
    }
    
    .toolbar-separator {
      width: 1px;
      height: 24px;
      background: #dee2e6;
      margin: 0 5px;
    }
    
    /* 主容器 */
    .main-container {
      height: calc(100% - 80px);
      display: flex;
    }
    
    /* 左侧连接面板 */
    .left-panel {
      width: 220px;
      background: #f8f9fa;
      border-right: 1px solid #dee2e6;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    .panel-header {
      padding: 8px 10px;
      background: #e9ecef;
      border-bottom: 1px solid #dee2e6;
      font-size: 13px;
      font-weight: bold;
      color: #495057;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .panel-header-btn {
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 16px;
      color: #6c757d;
    }
    
    .panel-header-btn:hover {
      background: #dee2e6;
    }
    
    .tree-container {
      flex: 1;
      overflow: auto;
      padding: 5px;
    }
    
    /* 中间数据库对象面板 */
    .middle-panel {
      width: 250px;
      background: white;
      border-right: 1px solid #dee2e6;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    /* 右侧工作区 */
    .right-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: white;
      overflow: hidden;
    }
    
    /* 标签页样式 */
    .tabs-header {
      display: flex;
      background: #f8f9fa;
      border-bottom: 1px solid #dee2e6;
      overflow-x: auto;
      min-height: 32px;
    }
    
    .tab-item {
      padding: 6px 15px;
      border-right: 1px solid #dee2e6;
      cursor: pointer;
      font-size: 13px;
      color: #495057;
      background: #e9ecef;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .tab-item.active {
      background: white;
      color: #007bff;
      border-bottom: 2px solid #007bff;
    }
    
    .tab-item:hover:not(.active) {
      background: #dee2e6;
    }
    
    .tab-close {
      margin-left: 5px;
      color: #6c757d;
      font-size: 14px;
    }
    
    .tab-close:hover {
      color: #dc3545;
    }
    
    .tabs-content {
      flex: 1;
      overflow: auto;
      padding: 10px;
    }
    
    /* zTree 自定义样式 */
    .ztree {
      margin: 0;
      padding: 5px;
      color: #495057;
    }
    
    .ztree li a {
      padding: 0 3px;
      font-size: 13px;
    }
    
    .ztree li a:hover {
      background-color: #e9ecef;
      border-radius: 3px;
    }
    
    .ztree li a.curSelectedNode {
      background-color: #007bff;
      color: white;
      border-radius: 3px;
    }
    
    /* zTree 节点图标 */
    .ztree li span.button.server_ico_open,
    .ztree li span.button.server_ico_close,
    .ztree li span.button.server_ico_docu {
      background: none;
    }
    .ztree li span.button.server_ico_open::before,
    .ztree li span.button.server_ico_close::before,
    .ztree li span.button.server_ico_docu::before {
      content: "\e857"; font-family: "layui-icon"; font-size: 16px; color: #5cb85c;
    }
    .ztree li span.button.database_ico_open,
    .ztree li span.button.database_ico_close,
    .ztree li span.button.database_ico_docu {
      background: none;
    }
    .ztree li span.button.database_ico_open::before,
    .ztree li span.button.database_ico_close::before,
    .ztree li span.button.database_ico_docu::before {
      content: "\e857"; font-family: "layui-icon"; font-size: 16px; color: #337ab7;
    }
    .ztree li span.button.table_ico_open,
    .ztree li span.button.table_ico_close,
    .ztree li span.button.table_ico_docu {
      background: none;
    }
    .ztree li span.button.table_ico_open::before,
    .ztree li span.button.table_ico_close::before,
    .ztree li span.button.table_ico_docu::before {
      content: "\e62d"; font-family: "layui-icon"; font-size: 16px; color: #f0ad4e;
    }
    .ztree li span.button.column_ico_open,
    .ztree li span.button.column_ico_close,
    .ztree li span.button.column_ico_docu {
      background: none;
    }
    .ztree li span.button.column_ico_open::before,
    .ztree li span.button.column_ico_close::before,
    .ztree li span.button.column_ico_docu::before {
      content: "\e665"; font-family: "layui-icon"; font-size: 14px; color: #999;
    }
    .ztree li span.button.key_ico_open,
    .ztree li span.button.key_ico_close,
    .ztree li span.button.key_ico_docu {
      background: none;
    }
    .ztree li span.button.key_ico_open::before,
    .ztree li span.button.key_ico_close::before,
    .ztree li span.button.key_ico_docu::before {
      content: "\e665"; font-family: "layui-icon"; font-size: 14px; color: #e6a23c;
    }
    
    /* 状态栏 */
    .status-bar {
      height: 24px;
      background: #f8f9fa;
      border-top: 1px solid #dee2e6;
      padding: 0 10px;
      display: flex;
      align-items: center;
      font-size: 12px;
      color: #6c757d;
      gap: 20px;
    }
    
    /* 分隔条 */
    .resizer {
      width: 5px;
      cursor: col-resize;
      background: #f8f9fa;
      position: relative;
    }
    
    .resizer:hover {
      background: #007bff;
    }
    
    /* 空状态 */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #6c757d;
      font-size: 14px;
    }
    
    .empty-state i {
      font-size: 48px;
      margin-bottom: 10px;
      color: #adb5bd;
    }
    
    /* SQL 编辑器区域 */
    .sql-editor {
      width: 100%;
      height: 200px;
      border: 1px solid #dee2e6;
      border-radius: 3px;
      padding: 10px;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 13px;
      resize: vertical;
    }
    
    /* 结果表格容器 - 固定高度，独立滚动 */
    .query-result-container {
      margin-top: 20px;
      max-height: calc(100vh - 450px);
      overflow: auto;
      border: 1px solid #dee2e6;
      border-radius: 3px;
    }
    
    /* 结果表格 */
    .result-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 13px;
    }
    
    .result-table th {
      background: #e9ecef;
      padding: 8px;
      text-align: left;
      border: 1px solid #dee2e6;
      font-weight: 600;
    }
    
    .result-table td {
      padding: 6px 8px;
      border: 1px solid #dee2e6;
    }
    
    .result-table tr:hover {
      background: #f8f9fa;
    }
    
    /* 查询结果容器 - 固定高度，独立滚动 */
    .query-result-container {
      height: calc(100% - 80px);
      overflow: visible;
      margin-top: 10px;
      position: relative;
    }
    
    .query-result-container .layui-table-view {
      margin: 0;
    }
    
    /* 确保分页组件可见 */
    .query-result-container .layui-table-page {
      border-top: 1px solid #e6e6e6;
      background: #fff;
    }

    <#noparse>
    /* zTree 节点紧凑布局 */
    .ztree li { padding: 1px 0 !important; margin: 0 !important; white-space: nowrap; }
    .ztree li ul { padding-left: 18px; }
    .ztree li span.button.switch { display: inline-block !important; vertical-align: middle !important; width: 21px !important; height: 21px !important; }
    .ztree li a { display: inline-block !important; height: 21px !important; line-height: 21px !important; vertical-align: middle !important; }
    .ztree li a .node_name { vertical-align: middle; }
    .ztree li span.button.ico_close,
    .ztree li span.button.ico_open,
    .ztree li span.button.ico_docu { display: none !important; }
    .ztree .tree-icon { font-size: 14px; margin-right: 2px; vertical-align: middle; font-style: normal; }
    .ztree .tree-icon-server { color: #e6a23c; }
    .ztree .tree-icon-database { color: #409eff; }
    .ztree .tree-icon-table { color: #67c23a; }
    .ztree .tree-icon-column { color: #909399; }
    .ztree .tree-icon-key { color: #e6a23c; }
    .data-edit-table td.cell-highlight { background-color: #e6f7ff !important; outline: 2px solid #409eff; }
    .data-edit-table tr.row-highlight td { background-color: #e6f7ff !important; }
    </#noparse>
  </style>
  <script src="/webdb/jquery-3.7.1.min.js"></script>
  <script src="/webdb/zTree/jquery.ztree.all.min.js"></script>
</head>
<body>
  <!-- 顶部工具栏 -->
  <div class="toolbar">
    <div class="toolbar-menu">
      <a id="fileMenu">文件</a>
      <a id="editMenu">编辑</a>
      <a id="queryMenu">查询</a>
      <a id="toolMenu">工具</a>
      <a id="helpMenu">帮助</a>
    </div>
    <div class="toolbar-buttons">
      <button class="toolbar-btn" onclick="openSessionManager()" title="新增会话">
        <i class="layui-icon layui-icon-add-circle"></i>
        <span>新增会话</span>
      </button>
      <button class="toolbar-btn" onclick="refreshTree()" title="刷新">
        <i class="layui-icon layui-icon-refresh"></i>
        <span>刷新</span>
      </button>
      <div class="toolbar-separator"></div>
     
      <button class="toolbar-btn primary" onclick="runQuery()" title="执行查询 (F9)">
        <i class="layui-icon layui-icon-triangle-r"></i>
        <span>执行</span>
      </button>
      <button id="btnCopySql" class="toolbar-btn" onclick="copyCurrentSql()" title="复制当前查询框中SQL" disabled style="opacity:0.5;cursor:not-allowed;">
        <i class="layui-icon layui-icon-file-b"></i>
        <span>复制</span>
      </button>
      <button id="btnClearSql" class="toolbar-btn" onclick="clearCurrentSql()" title="清空当前查询框中SQL" disabled style="opacity:0.5;cursor:not-allowed;">
        <i class="layui-icon layui-icon-delete"></i>
        <span>清空</span>
      </button>
      <div class="toolbar-separator"></div>
      <div style="position:relative;display:inline-block;">
        <button id="btnExport" class="toolbar-btn" onclick="toggleExportMenu()" title="导出" disabled style="opacity:0.5;cursor:not-allowed;">
          <i class="layui-icon layui-icon-export"></i>
          <span>导出 ▾</span>
        </button>
      </div>
      <button class="toolbar-btn" onclick="newQuery()" title="新建查询">
        <i class="layui-icon layui-icon-file"></i>
        <span>新建查询</span>
      </button>
    </div>
  </div>

  <!-- 主容器 -->
  <div class="main-container">
    <!-- 左侧：会话/连接树 -->
    <div class="left-panel">
      <div class="panel-header">
        <span>会话管理器</span>
        <span class="panel-header-btn" onclick="openSessionManager()" title="管理会话">
          <i class="layui-icon layui-icon-set"></i>
        </span>
      </div>
      <div class="tree-container">
        <ul id="sessionTree" class="ztree"></ul>
      </div>
    </div>

    <!-- 分隔条 -->
    <div class="resizer" id="resizer2"></div>

    <!-- 右侧：工作区 -->
    <div class="right-panel">
      <div class="tabs-header" id="tabsHeader">
        <div class="tab-item active" data-tab="structure">
          <i class="layui-icon layui-icon-template"></i>
          <span>表结构</span>
        </div>
        <div class="tab-item" data-tab="data">
          <i class="layui-icon layui-icon-table"></i>
          <span>数据</span>
        </div>
        <div class="tab-item" data-tab="query">
          <i class="layui-icon layui-icon-file"></i>
          <span>查询</span>
        </div>
      </div>
      <div class="tabs-content" id="tabsContent">
        <!-- 表结构标签页 -->
        <div class="tab-content active" data-content="structure">
          <div id="structureView">
            <div class="empty-state">
              <i class="layui-icon layui-icon-template"></i>
              <p>请从左侧选择一个表查看结构</p>
            </div>
          </div>
        </div>
        
        <!-- 数据标签页 -->
        <div class="tab-content" data-content="data" style="display: none;">
          <div id="dataView">
            <div class="empty-state">
              <i class="layui-icon layui-icon-table"></i>
              <p>请从左侧选择一个表查看数据</p>
            </div>
          </div>
        </div>
        
        <!-- 查询标签页 -->
        <div class="tab-content" data-content="query" style="display: none;">
          <div id="queryView" style="display:flex;flex-direction:column;height:100%;">
            <div style="padding:5px 8px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #eee;">
              <span id="queryInfo" style="font-size:12px;color:#999;margin-left:auto;"></span>
            </div>
            <div style="padding:5px 8px;">
              <textarea id="sqlInput" rows="5" placeholder="输入 SQL 查询语句，按 Ctrl+Enter 或点击执行按钮运行" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:4px;font-family:Consolas,monospace;font-size:13px;resize:vertical;"></textarea>
            </div>
            <div id="queryResult" style="flex:1;overflow:auto;padding:0 8px 8px;">
              <div class="empty-state" style="padding:30px 0;">
                <p style="color:#999;">输入 SQL 语句并执行</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 状态栏 -->
  <div class="status-bar">
    <span id="statusText">就绪</span>
    <span>|</span>
    <span id="connectionInfo"></span>
    <span>|</span>
    <span id="queryTime"></span>
  </div>

  <!-- 加载 Layui -->
  <script src="/webdb/layui/layui.js"></script>
  
  <!-- 加载菜单脚本 -->
  <script src="/webdb/fileMenu.js?v=${.now?long}"></script>
  <script src="/webdb/editMenu.js"></script>
  <script src="/webdb/queryMenu.js"></script>
  <script src="/webdb/toolMenu.js"></script>
  <script src="/webdb/helpMenu.js"></script>
  
  
  <script src="/webdb/BtnMenu.js?v=${.now?long}"></script>
  <script src="/webdb/session/crypto.js?v=${.now?long}"></script>
  <script src="/webdb/session/session.js?v=${.now?long}"></script>
  <script src="/webdb/session/sessionMenu.js?v=${.now?long}"></script>
  <script src="/webdb/session/tableTab.js?v=${.now?long}"></script>
  <script src="/webdb/session/tableDataTab.js?v=${.now?long}"></script>
  <script src="/webdb/session/tableQueryTab.js?v=${.now?long}"></script>

  <script>
    // 全局变量
    var layer = layui.layer;
    var currentSession = null;
    var currentTable = null;
    var infos = WebdbCrypto.loadConfigs();
    // 启动时同步配置到后端内存
    if (infos.length > 0) {
        $.ajax({ url: '/webdb/config/sync', type: 'POST', contentType: 'application/json', data: JSON.stringify(infos) });
    }

    // 初始化
    $(document).ready(function() {
      initSessionTree();
      initDatabaseTree();
      initTabs();
      initResizers();
      bindKeyboardShortcuts();
      bindSessionTreeContextMenu();
    });
  </script>
</body>
</html>
